# Publishes one numbered Curl release's NuGet packages to nuget.org with Trusted Publishing
# (ADR-1443, BL-2393): GitHub's OIDC token is exchanged by NuGet/login for an API key that lives
# one hour, so no long-lived nuget.org key exists in the repository, its secrets or a terminal.
#
# Run by hand only (Actions -> NuGet publish -> Run workflow, or
# `gh workflow run nuget-publish.yml -f tag=v0.4.0-preview.2`). The job runs in the `nuget`
# environment, which needs Stewart's approval before it starts. It publishes exactly the
# .nupkg files release.yml attached to that tag - the packages CI built - after checking them
# against the release's SHA256SUMS and checking that each carries the tag's version.
#
# nuget.org's trust policy names this repository, this file (nuget-publish.yml) and the
# `nuget` environment. The repository variable NUGET_USER holds the nuget.org profile name
# (not an e-mail address, not a key).
name: NuGet publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Numbered release tag to publish, e.g. v0.4.0-preview.2 (never preview)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to nuget.org
    runs-on: ubuntu-latest
    environment: nuget
    timeout-minutes: 30
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a numbered release tag (vX.Y.Z or vX.Y.Z-suffix); the rolling preview is never published."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir packages
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.nupkg' -p 'SHA256SUMS' -D packages
          ls -l packages

      - name: Check the packages against SHA256SUMS and the tag's version
        working-directory: packages
        run: |
          shopt -s nullglob
          files=(*.nupkg)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::the release has no .nupkg files"; exit 1; fi
          for f in "${files[@]}"; do
            line=$(awk -v f="$f" '$2 == f || $2 == "*" f { print $1 "  " f }' SHA256SUMS)
            if [ -z "$line" ]; then echo "::error::$f is not listed in SHA256SUMS"; exit 1; fi
            echo "$line" | sha256sum -c - || { echo "::error::$f does not match SHA256SUMS"; exit 1; }
            case "$f" in
              *".$VERSION.nupkg") ;;
              *) echo "::error::$f does not carry version $VERSION"; exit 1 ;;
            esac
          done
          echo "${#files[@]} packages checked"

      - name: Get a short-lived nuget.org key (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Push to nuget.org
        working-directory: packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for f in *.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
