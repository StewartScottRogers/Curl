# Publishes the native-AOT `curl` binary for every supported platform, and the Curl.Mcp
# NuGet packages (BL-2485; they stay off nuget.org until the port is complete), each runtime's
# holding a native-AOT Curl.Mcp packed on its own OS (BL-2486).
#
#   * Pushing a tag `v*` (e.g. v0.1.0) builds all six curl packages and the seven Curl.Mcp
#     `.nupkg` files, stamped with the tag's version, and attaches them, with a SHA256SUMS
#     file covering all of them, to a GitHub release of that name. A tag with a hyphen
#     (v0.1.0-preview.1) makes a pre-release. Numbered tags and releases need Stewart's
#     say-so (CLAUDE.md), so this workflow never creates a numbered tag itself.
#   * Every push to master (each shift-end merge, audit or gap merge) rebuilds the rolling
#     pre-release `preview`: the old `preview` release and its tag are deleted and made again
#     at the new commit, with packages stamped 0.2.0-rolling.<run number>. Stewart's standing
#     permission (2026-10-19) covers moving that one tag. DOWNLOAD.md links to
#     releases/download/preview/<package>, so the download page always offers the latest
#     build without being edited. A newer push to master cancels an older one's build.
#   * Running it by hand (workflow_dispatch) builds the same packages and uploads them as
#     workflow artifacts only - a dry run that publishes nothing. A pull request that
#     touches this file, the executable or the shared build settings gets the same dry run.
#
# Native AOT cannot cross-compile between operating systems, so each package is built on
# a runner of its own OS. Linux builds on Ubuntu 22.04 so the binary runs on glibc 2.35
# and newer. DOWNLOAD.md, install.sh and install.ps1 rely on the package names below;
# keep the four in step. The Curl.Mcp package names come from Curl.Mcp.csproj (ADR-0548).
# DOWNLOAD.md links to the rolling `preview` tag, because releases/latest skips pre-releases.
name: Release

on:
  push:
    tags: ['v*']
    branches: [master]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Curl.Console/**
      - Curl.Mcp/**
      - Directory.Build.props
      - global.json
  workflow_dispatch:

permissions:
  contents: read

# A newer push to master replaces the rolling build in progress; a tag's build always finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest,    archive: zip }
          - { rid: win-arm64,   runner: windows-11-arm,    archive: zip }
          - { rid: linux-x64,   runner: ubuntu-22.04,      archive: tar.gz }
          - { rid: linux-arm64, runner: ubuntu-22.04-arm,  archive: tar.gz }
          - { rid: osx-x64,     runner: macos-latest,      archive: tar.gz }
          - { rid: osx-arm64,   runner: macos-latest,      archive: tar.gz }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PACKAGE: curl-${{ matrix.rid }}.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            echo "VERSION=0.2.0-rolling.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # The AOT linker finds MSVC through vswhere, which must be on PATH (Curl.Console.csproj).
      - name: Put vswhere on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        shell: bash
        run: dotnet publish Curl.Console -c Release -r ${{ matrix.rid }} -p:Version="$VERSION" -o publish

      - name: Smoke test
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          # The binary must start and answer --version.
          ./publish/curl --version

      - name: Package
        shell: bash
        run: |
          mkdir package
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp publish/curl.exe package/
            cp LICENSE.txt README.md package/
            (cd package && 7z a "../$PACKAGE" curl.exe LICENSE.txt README.md)
          else
            cp publish/curl package/
            cp LICENSE.txt README.md package/
            tar -czf "$PACKAGE" -C package curl LICENSE.txt README.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  # Curl.Mcp packs as a .NET tool of native-AOT binaries (ADR-0599): with -p:PublishAot=true,
  # `dotnet pack` with no runtime makes the tool package that points at the six runtime packages, and `dotnet pack -r <rid>`
  # makes each runtime's package. AOT cannot cross-compile between operating systems, so each
  # runtime package is packed on a runner of its own OS, as the curl binaries are published above.
  pack-mcp:
    name: Pack Curl.Mcp ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: any,         runner: ubuntu-latest }
          - { rid: win-x64,     runner: windows-latest }
          - { rid: win-arm64,   runner: windows-11-arm }
          - { rid: linux-x64,   runner: ubuntu-22.04 }
          - { rid: linux-arm64, runner: ubuntu-22.04-arm }
          - { rid: osx-x64,     runner: macos-latest }
          - { rid: osx-arm64,   runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            echo "VERSION=0.2.0-rolling.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # The repository's server.json keeps the version of Curl.Mcp.csproj; a release packs a
      # copy that says the release's version in both places.
      - name: Stamp the version into server.json
        shell: pwsh
        run: |
          $path = 'Curl.Mcp/.mcp/server.json'
          $json = Get-Content $path -Raw
          $json = $json -replace '("version":\s*)"[^"]*"', "`$1`"$env:VERSION`""
          Set-Content $path $json -NoNewline

      # The AOT linker finds MSVC through vswhere, which must be on PATH.
      - name: Put vswhere on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

      - name: Install the native toolchain
        if: runner.os == 'Linux' && matrix.rid != 'any'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack the tool package
        if: matrix.rid == 'any'
        shell: bash
        run: dotnet pack Curl.Mcp -c Release -p:PublishAot=true -p:Version="$VERSION" -o curl-mcp-packages

      - name: Pack the runtime package
        if: matrix.rid != 'any'
        shell: bash
        run: dotnet pack Curl.Mcp -c Release -r "$RID" -p:PublishAot=true -p:Version="$VERSION" -o curl-mcp-packages

      # The tool package carries .mcp/server.json at the release's version; a runtime package
      # carries its native binary, never Curl.Mcp.dll, and (where the runner can run it) that
      # binary answers initialize over standard input and output.
      - name: Check the package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $files = @(Get-ChildItem curl-mcp-packages -Filter '*.nupkg')
          $files | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
          $name = if ($env:RID -eq 'any') { "Curl.Mcp.$env:VERSION.nupkg" } else { "Curl.Mcp.$env:RID.$env:VERSION.nupkg" }
          if ($files.Count -ne 1 -or $files[0].Name -ne $name) { throw "expected only $name" }
          $zip = [IO.Compression.ZipFile]::OpenRead($files[0].FullName)
          try {
            if ($env:RID -eq 'any') {
              $entry = $zip.Entries | Where-Object { $_.FullName -eq '.mcp/server.json' }
              if (-not $entry) { throw "$name has no .mcp/server.json" }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { $server = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
              if ($server.version -ne $env:VERSION -or $server.packages[0].version -ne $env:VERSION) { throw "server.json does not say $env:VERSION" }
              return
            }
            $binary = if ($env:RID -like 'win-*') { 'Curl.Mcp.exe' } else { 'Curl.Mcp' }
            $entry = $zip.Entries | Where-Object { $_.FullName -eq "tools/any/$env:RID/$binary" }
            if (-not $entry) { throw "$name has no native tools/any/$env:RID/$binary" }
            if ($zip.Entries | Where-Object { $_.FullName -eq "tools/any/$env:RID/Curl.Mcp.dll" }) { throw "$name holds Curl.Mcp.dll: it was not published native AOT" }
            $native = Join-Path $env:RUNNER_TEMP $binary
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $native, $true)
          }
          finally { $zip.Dispose() }
          if ($env:RID -eq 'osx-x64') { return }
          if (-not $IsWindows) { chmod +x $native }
          # Standard input stays open until the answer is read: the server stops at end of input,
          # whether or not it has answered.
          $start = [Diagnostics.ProcessStartInfo]::new($native)
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $server = [Diagnostics.Process]::Start($start)
          $server.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"1"}}}')
          $server.StandardInput.Flush()
          $read = $server.StandardOutput.ReadLineAsync()
          $answer = if ($read.Wait(60000)) { $read.Result } else { '' }
          $server.StandardInput.Close()
          if (-not $server.WaitForExit(10000)) { $server.Kill($true) }
          Write-Host $answer
          if ("$answer" -notlike '*"serverInfo"*') { throw "$binary did not answer initialize" }

      - uses: actions/upload-artifact@v4
        with:
          name: curl-mcp-${{ matrix.rid }}
          path: curl-mcp-packages/*.nupkg
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [publish, pack-mcp]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum curl-* *.nupkg > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            # The rolling preview: drop the old one and its tag, then make it again here.
            gh release delete preview --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create preview dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Latest build (rolling preview)" \
              --notes "The latest build of master, ${GITHUB_SHA:0:9}, made $(date -u +%Y-%m-%dT%H:%MZ), version 0.2.0-rolling.${GITHUB_RUN_NUMBER}. It is rebuilt on every merge to master; numbered releases are kept separately."
            exit 0
          fi
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
