# Builds Curl and runs the fast tests on every operating system a release ships for, so a
# change that only works on Windows fails here rather than in someone's shell script.
name: CI

on:
  push:
    # factory/* holds lanes' partial work, which is not expected to pass; board holds only
    # the dark factory's lane heartbeats, force-pushed every few minutes, with no code to build.
    branches-ignore: [gource, board, 'factory/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. On work/dark-factory a running run always finishes: parallel
# lanes push more often than a run takes, and cancelling left Linux and macOS untested for
# hours (ADR-0693). Only the waiting run is replaced by a newer push, so the newest commit
# is always the next one tested. Every other ref cancels its running run as before.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/work/dark-factory' }}

# The shift-end merge's pull request (head factory/merge-<stamp>, ShiftEnd.ps1) runs no build,
# test, pack or quality job (ADR-0814). Its head is the work/dark-factory commit whose push run
# already passed on Windows, Linux and macOS, the merge does not wait for this run, and master's
# push run tests the merge commit straight after. Run in full, it only took runners from the
# next work/dark-factory run (BL-3512: run 40206727905's jobs started up to 11 minutes late).
# Each such job's if repeats the test, since a job's if cannot read workflow env. The audit
# guard keeps its own if, under which it already skips that pull request.
#
# A push to master whose merge commit holds the very tree of one of its parents that a CI push
# run already passed (the shift-end merge, an audit or gap merge that had master merged in)
# runs none of those jobs either: tested-tree finds that run and every other job's if reads
# its answer. Run in full, it only repeated that test while it took runners from the next
# work/dark-factory run (BL-3512: master's run 40844580348 left run 40845247630 at 15m01s).
# On every other push and pull request tested-tree is skipped and adds no wait.

jobs:
  tested-tree:
    name: Tree already tested
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find a passed CI push run on a parent with the same tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          tested=false
          for parent in $(git rev-list --parents -n 1 HEAD | cut -d' ' -f2-); do
            [ "$(git rev-parse "$parent^{tree}")" = "$tree" ] || continue
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$parent&event=push&status=success" --jq '.total_count')
            if [ "${passed:-0}" -gt 0 ]; then
              echo "Tree $tree is $parent's, whose CI push run passed; skipping the build, test, pack and quality jobs."
              tested=true
              break
            fi
          done
          [ "$tested" = true ] || echo "No parent with tree $tree has a passed CI push run; running every job."
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  # Audit guard layer 3 (ADR-0267): fails when work/dark-factory, pushed or as a pull
  # request, carries a change of its own to Audit/, an auditor agent, or one of the guards
  # (the audit hook, .claude/settings.json, this workflow, task-board.ps1). Those reach
  # master only through the audit branch. It runs master's copy of the guard script, so
  # the factory cannot weaken it; a red run blocks the shift-end merge to master.
  audit-guard:
    name: Audit paths untouched by the dark factory
    if: github.ref == 'refs/heads/work/dark-factory' || github.head_ref == 'work/dark-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For a pull request, the branch's head commit, not GitHub's merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch master
        run: git fetch origin master

      - name: Check audit paths
        shell: pwsh
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'Test-AuditPathsUntouched.ps1'
          git show origin/master:Audit/Guard/Test-AuditPathsUntouched.ps1 > $guard 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'master has no guard script yet; running the checked-out copy.'
            Copy-Item Audit/Guard/Test-AuditPathsUntouched.ps1 $guard
          }
          & $guard -Base origin/master -Head HEAD
          exit $LASTEXITCODE

  # The guard files work on every platform (BL-3926, ADR-1015): each hook command in
  # .claude/settings.json starts through sh and the audit guard hook refuses a lane, and the
  # audit guard's own self-test passes.
  guard-hooks:
    name: Guard hooks (${{ matrix.os }})
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && !startsWith(github.head_ref, 'factory/merge-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Hook commands start and the audit guard hook refuses a lane
        shell: pwsh
        run: ./Audit/Guard/Test-GuardHooks.ps1

      - name: Audit guard self-test
        shell: pwsh
        run: ./Audit/Guard/Test-AuditPathsUntouched.ps1 -SelfTest

  # The audit office's scripts work on every platform (BL-3927): every self-test of
  # Audit/RunAudit.ps1, Audit/Tools and Audit/PlantedDefects, under Windows PowerShell on
  # Windows and pwsh elsewhere, as RunAudit.cmd and RunAudit.sh run them.
  audit-self-tests:
    name: Audit self-tests (${{ matrix.os }})
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && !startsWith(github.head_ref, 'factory/merge-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run every audit self-test
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'powershell' } else { 'pwsh' }
          $failed = @()
          foreach ($script in @(Get-Item Audit/RunAudit.ps1) + @(Get-ChildItem Audit/Tools/*.ps1, Audit/PlantedDefects/*.ps1)) {
            if ((Get-Content -Raw $script.FullName) -notmatch '\[switch\]\$SelfTest') { continue }
            Write-Host "::group::$($script.Name)"
            & $exe -NoProfile -ExecutionPolicy Bypass -File $script.FullName -SelfTest
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code) { $failed += $script.Name; Write-Host "::error::$($script.Name) -SelfTest exited $code" }
          }
          if ($failed) { exit 1 }

  test:
    name: Build and test (${{ matrix.os }})
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && !startsWith(github.head_ref, 'factory/merge-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Fast tests
        run: dotnet test -c Release --no-build --filter "TestCategory!=Integration"

  # Packs the Curl.Mcp MCP server and runs its Integration tests, all but the native AOT class
  # the package check stands in for, on every operating system (BL-2391, BL-3512). Curl.Mcp is native AOT (ADR-0621, BL-2517), and AOT cannot cross-compile between
  # operating systems, so each runner packs the runtime package of its own runtime, as
  # release.yml's pack-mcp does, and the Linux runner also packs the Curl.Mcp tool package with
  # .mcp/server.json. The packages are uploaded, never published.
  mcp-pack:
    name: Pack Curl.Mcp (${{ matrix.os }})
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && !startsWith(github.head_ref, 'factory/merge-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64, tool: true }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RID: ${{ matrix.rid }}
      PACKAGES: curl-mcp-packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The AOT linker finds MSVC through vswhere, which must be on PATH.
      - name: Put vswhere on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer" >> "$GITHUB_PATH"

      # All but CurlMcpNativeAotIntegrationTests, whose class publishes Curl.Mcp native AOT a
      # second time (the runtime package below publishes it once) and made this step 5 to 12
      # minutes, the run's longest job (BL-3512, ADR-1179). The package check below drives the
      # packed native binary through initialize and tools/list instead, and integration.yml
      # still runs that class on every operating system.
      - name: Curl.Mcp Integration tests
        run: dotnet test Curl.Mcp.IntegrationTests -c Release --filter "TestCategory=Integration&FullyQualifiedName!~CurlMcpNativeAotIntegrationTests"

      - name: Pack the tool package
        if: matrix.tool
        shell: bash
        run: dotnet pack Curl.Mcp -c Release -o "$PACKAGES/tool"

      - name: Pack the runtime package
        shell: bash
        run: dotnet pack Curl.Mcp -c Release -r "$RID" -o "$PACKAGES/runtime"

      # The tool package carries .mcp/server.json; the runtime package carries its native binary,
      # never Curl.Mcp.dll, and that binary answers initialize and lists its five tools over
      # standard input and output.
      - name: Check the packages
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $tool = Join-Path $env:PACKAGES 'tool'
          if (Test-Path $tool) {
            $files = @(Get-ChildItem $tool -Filter '*.nupkg')
            $files | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
            if ($files.Count -ne 1 -or $files[0].Name -notmatch '^Curl\.Mcp\.\d') { throw 'expected only the Curl.Mcp tool package' }
            $zip = [IO.Compression.ZipFile]::OpenRead($files[0].FullName)
            try { if ($zip.Entries.FullName -notcontains '.mcp/server.json') { throw "$($files[0].Name) has no .mcp/server.json" } }
            finally { $zip.Dispose() }
          }
          $files = @(Get-ChildItem (Join-Path $env:PACKAGES 'runtime') -Filter '*.nupkg')
          $files | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
          if ($files.Count -ne 1 -or $files[0].Name -notlike "Curl.Mcp.$env:RID.*") { throw "expected only the Curl.Mcp.$env:RID package" }
          $name = $files[0].Name
          $binary = if ($env:RID -like 'win-*') { 'Curl.Mcp.exe' } else { 'Curl.Mcp' }
          $zip = [IO.Compression.ZipFile]::OpenRead($files[0].FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq "tools/any/$env:RID/$binary" }
            if (-not $entry) { throw "$name has no native tools/any/$env:RID/$binary" }
            if ($zip.Entries | Where-Object { $_.FullName -eq "tools/any/$env:RID/Curl.Mcp.dll" }) { throw "$name holds Curl.Mcp.dll: it was not published native AOT" }
            $native = Join-Path $env:RUNNER_TEMP $binary
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $native, $true)
          }
          finally { $zip.Dispose() }
          if (-not $IsWindows) { chmod +x $native }
          # Standard input stays open until the answer is read: the server stops at end of input,
          # whether or not it has answered.
          $start = [Diagnostics.ProcessStartInfo]::new($native)
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $server = [Diagnostics.Process]::Start($start)
          $server.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          $server.StandardInput.Flush()
          $read = $server.StandardOutput.ReadLineAsync()
          $answer = if ($read.Wait(60000)) { $read.Result } else { '' }
          $tools = @()
          if ("$answer" -like '*"serverInfo"*') {
            $server.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}')
            $server.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
            $server.StandardInput.Flush()
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline) {
              $read = $server.StandardOutput.ReadLineAsync()
              if (-not $read.Wait(60000) -or $null -eq $read.Result) { break }
              $message = $read.Result | ConvertFrom-Json
              if ($message.id -eq 2) { $tools = @($message.result.tools | ForEach-Object { $_.name } | Sort-Object); break }
            }
          }
          $server.StandardInput.Close()
          if (-not $server.WaitForExit(10000)) { $server.Kill($true) }
          Write-Host $answer
          Write-Host "tools: $($tools -join ', ')"
          if ("$answer" -notlike '*"serverInfo"*') { throw "$binary did not answer initialize" }
          if (($tools -join ',') -cne 'build_url,curl,parse_url,transfer,version') { throw "$binary did not list its five tools" }

      - uses: actions/upload-artifact@v4
        with:
          name: curl-mcp-${{ matrix.os }}
          path: curl-mcp-packages/**/*.nupkg
          if-no-files-found: error

  # The four quality gates (CLAUDE.md "Quality gates"): 100% line and branch coverage,
  # complexity at most 10 and CRAP at most 30 for every member, measured as the coverage
  # page measures them. The build's CA1502 counts complexity on the source and can pass a
  # method the coverage report counts above 10, so these jobs are what keep the page green:
  # Measure-CodeQuality.ps1 exits 1 when any member is outside a gate (BL-2068). Windows
  # only, where the gates are measured, as gource.yml's coverage job does.
  #
  # One job measuring every library took 10 to 27 minutes and was the whole run's critical
  # path, so the coverage is collected by three parallel shard jobs (BL-3464), each running
  # a disjoint set of the *.UnitTests projects that Measure-CodeQuality.ps1 -Shard deals by
  # their measured test-run time, and the quality job below scores them together. The shard
  # count is the matrix below and -ShardCount; change both together.
  quality-shard:
    name: Quality gates shard ${{ matrix.shard }} of 3 (windows-latest)
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && !startsWith(github.head_ref, 'factory/merge-') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The test platform waits 90 s by default for each test run's coverage collector to
      # connect. On a busy runner one run missed it and aborted, so its library measured as
      # uncovered and the job failed with nothing wrong in the code (PR #115's first run).
      VSTEST_CONNECTION_TIMEOUT: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect coverage for shard ${{ matrix.shard }}
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Measure-CodeQuality.ps1 -Shard ${{ matrix.shard }} -ShardCount 3 -ResultsDirectory "$env:RUNNER_TEMP\quality"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: quality-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/quality/**/*.cobertura.xml
            ${{ runner.temp }}/quality/shard-*.txt
          if-no-files-found: error
          retention-days: 3

  # Keeps the name the factory and the audit office know (CiWatch.ps1 files its failures):
  # it fails when any shard failed or was cancelled, when the shards together did not run
  # every test project once or left a gated library out, and when any member is outside a
  # gate, with one ::error annotation per such member as the single job gave.
  quality:
    name: Quality gates (windows-latest)
    needs: [tested-tree, quality-shard]
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' && !startsWith(github.head_ref, 'factory/merge-') }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VSTEST_CONNECTION_TIMEOUT: 600
    steps:
      - name: Every shard succeeded
        shell: pwsh
        run: |
          if ('${{ needs.quality-shard.result }}' -ne 'success') {
            Write-Host "::error::A Quality gates shard did not succeed (result: ${{ needs.quality-shard.result }}); see the shard jobs."
            exit 1
          }

      - uses: actions/checkout@v4

      # For the recheck: a member short of coverage reruns the test projects that reach it.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          pattern: quality-shard-*
          path: ${{ runner.temp }}/quality

      - name: Measure coverage, complexity and CRAP
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Measure-CodeQuality.ps1 -FromShards -ResultsDirectory "$env:RUNNER_TEMP\quality" -JsonPath "$env:RUNNER_TEMP\coverage.json"
          $code = $LASTEXITCODE
          if (-not (Test-Path "$env:RUNNER_TEMP\coverage.json")) { throw 'Measure-CodeQuality.ps1 wrote no JSON' }
          $data = Get-Content "$env:RUNNER_TEMP\coverage.json" -Raw | ConvertFrom-Json
          foreach ($m in @($data.failing)) {
            Write-Host "::error file=$($m.file.Replace('\', '/')),line=$($m.line)::$($m.member) is outside a gate: $($m.fails -join ', ')"
          }
          foreach ($name in @($data.missingLibraries)) {
            Write-Host "::error::$name is a gated library that no shard measured"
          }
          exit $code

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: quality-coverage-json
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: ignore
          retention-days: 7
