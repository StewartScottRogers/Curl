# Builds Curl and runs the fast tests on every operating system a release ships for, so a
# change that only works on Windows fails here rather than in someone's shell script.
name: CI

on:
  push:
    # factory/* holds lanes' partial work, which is not expected to pass; board holds only
    # the dark factory's lane heartbeats, force-pushed every few minutes, with no code to build.
    branches-ignore: [gource, board, 'factory/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Audit guard layer 3 (ADR-0267): fails when work/dark-factory, pushed or as a pull
  # request, carries a change of its own to Audit/, an auditor agent, or one of the guards
  # (the audit hook, .claude/settings.json, this workflow, task-board.ps1). Those reach
  # master only through the audit branch. It runs master's copy of the guard script, so
  # the factory cannot weaken it; a red run blocks the shift-end merge to master.
  audit-guard:
    name: Audit paths untouched by the dark factory
    if: github.ref == 'refs/heads/work/dark-factory' || github.head_ref == 'work/dark-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For a pull request, the branch's head commit, not GitHub's merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch master
        run: git fetch origin master

      - name: Check audit paths
        shell: pwsh
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'Test-AuditPathsUntouched.ps1'
          git show origin/master:Audit/Guard/Test-AuditPathsUntouched.ps1 > $guard 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'master has no guard script yet; running the checked-out copy.'
            Copy-Item Audit/Guard/Test-AuditPathsUntouched.ps1 $guard
          }
          & $guard -Base origin/master -Head HEAD
          exit $LASTEXITCODE

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Fast tests
        run: dotnet test -c Release --no-build --filter "TestCategory!=Integration"

  # The four quality gates (CLAUDE.md "Quality gates"): 100% line and branch coverage,
  # complexity at most 10 and CRAP at most 30 for every member, measured as the coverage
  # page measures them. The build's CA1502 counts complexity on the source and can pass a
  # method the coverage report counts above 10, so this job is what keeps the page green:
  # Measure-CodeQuality.ps1 exits 1 when any member is outside a gate (BL-2068). Windows
  # only, where the gates are measured, as gource.yml's coverage job does.
  quality:
    name: Quality gates (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Measure coverage, complexity and CRAP
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Measure-CodeQuality.ps1 -JsonPath "$env:RUNNER_TEMP\coverage.json"
          $code = $LASTEXITCODE
          if (-not (Test-Path "$env:RUNNER_TEMP\coverage.json")) { throw 'Measure-CodeQuality.ps1 wrote no JSON' }
          foreach ($m in @((Get-Content "$env:RUNNER_TEMP\coverage.json" -Raw | ConvertFrom-Json).failing)) {
            Write-Host "::error file=$($m.file.Replace('\', '/')),line=$($m.line)::$($m.member) is outside a gate: $($m.fails -join ', ')"
          }
          exit $code
